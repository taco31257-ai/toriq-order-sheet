<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鳥久 × 隼｜店內管理系統（主管測試版）</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#292923;font:15px system-ui,"Noto Sans TC",sans-serif}button,input,select,textarea{font:inherit}button{background:#28372f;color:#fff;border:0;border-radius:10px;padding:11px 14px;cursor:pointer}button.alt{background:#e7e8e1;color:#29352d}button.danger{background:#a54438}button:disabled{opacity:.5}input,select,textarea{width:100%;padding:11px;border:1px solid #d3d4ce;border-radius:9px;background:white;color:#222}input[type=checkbox]{width:18px;height:18px;vertical-align:middle}label{display:block;color:#62655d;font-size:13px;margin:13px 0 5px}header{background:#27352e;color:white;padding:16px 18px;position:sticky;top:0;z-index:9}header b{font-size:19px}header small{display:block;color:#e0e7db}.wrap{max-width:1040px;margin:auto;padding:14px 14px 105px}.card{background:#fff;border:1px solid #e1dfd9;border-radius:14px;padding:18px;margin:13px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row{display:flex;align-items:center;gap:9px}.row>*{min-width:0}.grow{flex:1}.muted{color:#798076;font-size:12px}.pill{display:inline-block;background:#eeeae1;padding:5px 9px;border-radius:7px;font-size:12px}.tabs{display:flex;gap:5px;position:sticky;top:65px;background:#f5f3ed;padding:10px 0;z-index:8}.tabs button{flex:1;padding:11px 3px;background:#e0e4de;color:#27352e}.tabs button.on{background:#27352e;color:#fff}.item{border-bottom:1px solid #e9e9e4;padding:13px 0}.item:last-child{border:0}.num{width:75px;flex:0 0 75px;text-align:center}.subtotal{font-size:18px;font-weight:700}.float{position:fixed;bottom:0;left:0;right:0;background:#27352e;color:white;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;z-index:12;box-shadow:0 -3px 14px #0002}.float button{background:#fff;color:#27352e;font-weight:bold}.float small{color:#d5dacf}.tag{height:80mm;width:50mm;background:white;color:black;padding:2.5mm;display:flex;flex-direction:column;font-family:Arial,"Microsoft JhengHei",sans-serif;overflow:hidden}.tag .nm{text-align:center;font-weight:bold;font-size:11pt;line-height:1.16;overflow-wrap:anywhere}.tag .pr{text-align:center;font-size:9pt;margin:1.2mm 0}.tag .des{flex:1;white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #888;padding-top:1.2mm;line-height:1.3;font-size:9pt;overflow:hidden}.tag .foot{display:flex;align-items:end;justify-content:space-between;font-size:9pt;margin-top:1mm}.tag .foot small{font-size:6pt}.preview{display:flex;justify-content:center;background:#eeece7;padding:15px;overflow:auto}.print-root{display:none}h2{font-size:19px;margin:5px 0 14px}h3{font-size:16px}pre{white-space:pre-wrap;word-break:break-word}.banner{background:#ffefc9;border:1px solid #eed99f;border-radius:10px;padding:11px;font-size:13px;color:#6e511c;margin:10px 0}.summary{padding:10px;background:#eff1ed;border-radius:9px;margin:10px 0}.small{font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button{flex:1}.hidden{display:none!important}
@media(min-width:760px){.float{left:50%;right:auto;transform:translateX(-50%);width:1040px}.wrap{padding-top:22px}.topmenu{max-width:650px;margin:auto}}@page{size:50mm 80mm;margin:0}@media print{body{background:white}header,.wrap,.float{display:none!important}.print-root{display:block}.tag{break-after:page;page-break-after:always}.tag:last-child{break-after:auto;page-break-after:auto}}
</style></head><body><header><div class="row"><div class="grow"><b id="head">鳥久 × 隼｜管理系統</b><small>手機操作測試版 · 不含正式進價</small></div><button class="alt" onclick="goHome()">切換店別</button></div></header>
<div class="wrap"><div class="banner">這是供主管測試的公開示範版。酒款、金額及供應商均為虛構測試資料；所有新增與叫貨紀錄僅儲存在各裝置的瀏覽器，彼此不會同步。請勿輸入正式店內進價或個資。</div><div id="view"></div></div><div class="float" id="float"><div class="grow"><small id="floatsmall">尚未選取</small><b id="floatmoney">NT$ 0</b></div><button onclick="jumpPreview()">預覽叫貨單 ↓</button></div><div class="print-root" id="printRoot"></div>
<script>
"use strict";
var shop="",page="home",category="全部",vendor="",staff="",delivery="",note="",counts={},searchText="",printJobs=[];
var WINE_TYPES=["全部","清酒","燒酎","利口酒"];
var wineSamples=[];
for(var a=0;a<24;a++){var ty=["清酒","燒酎","利口酒"][a%3];wineSamples.push({id:"demo-w"+a,name:ty+"示範酒款 "+String(a+1).padStart(2,"0"),type:ty,ml:a%4===0?1800:720,price:1200+(a%7)*180,cup:170+(a%5)*30,cost:480+(a%8)*80,supplier:["示範酒商甲","示範酒商乙","示範酒商丙"][a%3],desc:"這是供測試酒標排版的示範介紹文字。可以檢查酒名、容量、整瓶價格、介紹文長度，以及右下角的小字單杯價格。請勿將本酒款視為真實產品。"});}
var foodSamples=[{id:"f1",name:"示範高麗菜",supplier:"示範蔬菜商",unit:"斤",cost:35,weekday:3,weekend:6},{id:"f2",name:"示範洋蔥",supplier:"示範蔬菜商",unit:"斤",cost:40,weekday:2,weekend:5},{id:"f3",name:"示範雞腿肉",supplier:"示範肉品商",unit:"包",cost:260,weekday:4,weekend:8},{id:"f4",name:"示範醬油",supplier:"示範調味商",unit:"瓶",cost:190,weekday:2,weekend:3}];
var $=id=>document.getElementById(id);function safe(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function fmt(n){return Number(n||0).toLocaleString("zh-TW")}function key(kind){return "toriq-manager-mobile-demo-v1:"+shop+":"+kind}function load(kind,def){try{var v=localStorage.getItem(key(kind));return v?JSON.parse(v):def}catch(e){return def}}function store(kind,obj){localStorage.setItem(key(kind),JSON.stringify(obj))}function wines(){return load("wines",wineSamples.map(x=>Object.assign({},x)))}function foods(){return load("foods",foodSamples.map(x=>Object.assign({},x)))}function history(kind){return load("history-"+kind,[])}function h(tag,text){var e=document.createElement(tag);e.innerHTML=text;return e.outerHTML}function view(html){$("view").innerHTML=html;$("float").style.display="none";window.scrollTo(0,0)}function title(s){$("head").textContent=(shop?shop+"居酒屋｜":"")+"店內管理系統";return "<h2>"+safe(s)+"</h2>"}function goHome(){shop="";page="home";view('<div class="topmenu"><div class="card" style="text-align:center"><h2>選擇店別</h2><p class="muted">進入店別後再選擇系統功能</p><div class="grid"><button style="min-height:115px;font-size:24px" onclick="enterShop(\'鳥久\')">鳥久<br><span class="small">TORIKYU</span></button><button style="min-height:115px;font-size:24px" onclick="enterShop(\'隼\')">隼<br><span class="small">HAYABUSA</span></button></div></div></div>');$("head").textContent="鳥久 × 隼｜管理系統"}function enterShop(s){shop=s;showMenu()}function showMenu(){page="menu";view('<div class="topmenu"><div class="card">'+title("選擇功能")+'<div class="grid"><button style="min-height:105px" onclick="startFood()">食材叫貨</button><button style="min-height:105px" onclick="wineHub()">酒類管理</button></div><p class="muted">鳥久與隼的本機測試資料各自分開。</p></div></div>')}function wineHub(){page="winehub";view('<div class="card">'+title("酒類管理中心")+'<div class="grid"><button onclick="startOrder(\'wine\')">酒類叫貨</button><button onclick="showHistory(\'wine\')">酒類叫貨紀錄</button><button onclick="manualLabels()">手動酒標列印</button><button onclick="editWineList()">酒款資料管理</button></div><p style="margin-top:18px"><button class="alt" onclick="showMenu()">返回功能首頁</button></p></div>')}
var orderKind="wine";
function startFood(){startOrder("food")}function startOrder(kind){page="order";orderKind=kind;category="全部";vendor="";staff="";delivery="";note="";counts={};searchText="";drawOrder()}
function orderRows(){return orderKind==="wine"?wines():foods()}
function suppliers(){return [...new Set(orderRows().map(x=>x.supplier).filter(Boolean))].sort()}
function orderLines(){return orderRows().filter(x=>x.supplier===vendor&&Number(counts[x.id])>0).map(x=>({x:x,q:Number(counts[x.id])}))}
function orderTotal(){return orderLines().reduce((a,l)=>a+Number(l.x.cost||0)*l.q,0)}
function drawOrder(){var isWine=orderKind==="wine";var html='<div class="card">'+title(isWine?"酒類叫貨":"食材叫貨")+'<button class="alt" onclick="'+(isWine?'wineHub()':'showMenu()')+'">返回</button><label>選擇供應商</label><select id="vendor"><option value="">請選擇</option>'+suppliers().map(s=>'<option value="'+safe(s)+'"'+(s===vendor?' selected':'')+'>'+safe(s)+'</option>').join("")+'</select><label>叫貨人員</label><input id="staff" placeholder="輸入員工姓名" value="'+safe(staff)+'"><label>送貨日期</label><input id="date" type="date" value="'+safe(delivery)+'">'+(isWine?'<div class="tabs" id="catTabs"></div>':'')+'<label>搜尋品項</label><input id="search" placeholder="輸入酒名或品項" value="'+safe(searchText)+'"><div id="orderList"></div><div id="review" style="scroll-margin-top:90px"><h3>叫貨單預覽</h3><label>備註</label><textarea rows="2" id="note">'+safe(note)+'</textarea><div class="summary" id="summary"></div><button onclick="previewMessage()">預覽叫貨單</button><textarea id="message" rows="8" readonly style="margin:9px 0"></textarea><div class="actions"><button onclick="copyMessage()">複製訊息</button><button onclick="saveOrder()">儲存叫貨紀錄</button></div></div></div>';view(html);$("vendor").onchange=e=>{if(orderLines().length&&!confirm("切換廠商會清空本次數量，確定？")){e.target.value=vendor;return}vendor=e.target.value;counts={};renderItems()};$("staff").oninput=e=>staff=e.target.value;$("date").oninput=e=>delivery=e.target.value;$("note").oninput=e=>note=e.target.value;$("search").oninput=e=>{searchText=e.target.value;renderItems()};if(isWine)drawTabs();renderItems();$("float").style.display="flex"}
function drawTabs(){if(!$("catTabs"))return;$("catTabs").innerHTML=WINE_TYPES.map(x=>'<button class="'+(x===category?'on':'')+'" onclick="setCategory(\''+x+'\')">'+x+'</button>').join("")}function setCategory(x){category=x;drawTabs();renderItems()}
function renderItems(){var box=$("orderList");if(!box)return;box.innerHTML="";if(!vendor){box.innerHTML='<p class="muted">請先選擇供應商。</p>';updateOrder();return}var ls=orderRows().filter(x=>x.supplier===vendor&&(orderKind!=="wine"||(category==="全部"||x.type===category))&&x.name.toLowerCase().includes(searchText.trim().toLowerCase()));ls.forEach(x=>{var d=document.createElement("div");d.className="item";d.innerHTML='<div class="row"><div class="grow"><b>'+safe(x.name)+'</b><div class="muted">'+(orderKind==="wine"?safe(x.type)+"｜"+safe(x.ml)+"ml":"單位："+safe(x.unit)+"｜平日庫存："+x.weekday+"｜假日庫存："+x.weekend)+'｜示範進價 NT$ '+fmt(x.cost)+'</div></div><input class="num" type="number" min="0" max="999" step="1" placeholder="數量" value="'+(counts[x.id]||"")+'"></div>';d.querySelector("input").oninput=e=>{counts[x.id]=Math.max(0,Math.min(999,Math.floor(Number(e.target.value)||0)));updateOrder()};box.appendChild(d)});if(!ls.length)box.innerHTML='<p class="muted">找不到符合條件的品項。</p>';updateOrder()}
function updateOrder(){var ls=orderLines(),qty=ls.reduce((a,l)=>a+l.q,0),sum=orderTotal();$("summary").innerHTML="已選 "+ls.length+" 款・共 "+qty+" 件<br><span class=\"subtotal\">預估金額 NT$ "+fmt(sum)+"</span>";$("floatsmall").textContent="已選 "+ls.length+" 款・"+qty+" 件";$("floatmoney").textContent="NT$ "+fmt(sum);if($("message"))$("message").value=""}function jumpPreview(){$("review")&&$("review").scrollIntoView({behavior:"smooth",block:"start"})}
function makeMessage(){var ls=orderLines();if(!vendor||!staff.trim()||!delivery||!ls.length){alert("請填寫供應商、叫貨人員、送貨日期及數量");return null}return "【"+shop+"居酒屋｜"+vendor+" "+(orderKind==="wine"?"酒類":"食材")+"叫貨】\n送貨日期："+delivery+"\n"+ls.map(l=>l.x.name+" "+(orderKind==="wine"?l.x.ml+"ml ":"")+"× "+l.q+(orderKind==="wine"?"瓶":l.x.unit)).join("\n")+"\n備註："+note+"\n叫貨人員："+staff}
function previewMessage(){var t=makeMessage();if(t)$("message").value=t;return t}function copyText(t){if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(t).then(()=>true).catch(()=>false)}return Promise.resolve(false)}async function copyMessage(){var t=previewMessage();if(!t)return;var ok=await copyText(t);if(!ok){$("message").focus();$("message").select();alert("請長按或使用複製功能複製文字") }else alert("已複製，可以貼到 LINE")}
function saveOrder(){var t=previewMessage();if(!t)return;if(!confirm("確認將這張叫貨單儲存在本機測試紀錄？"))return;var hs=history(orderKind);hs.push({id:String(Date.now()),created:new Date().toISOString(),vendor:vendor,staff:staff,delivery:delivery,notes:note,lines:orderLines(),msg:t,total:orderTotal()});try{store("history-"+orderKind,hs);alert("測試紀錄已儲存。注意：僅存於目前裝置。");showHistory(orderKind)}catch(e){alert("儲存失敗："+e.message)}}
function showHistory(kind){page="history";var hs=history(kind).slice().reverse();var total=hs.reduce((a,h)=>a+h.total,0);var html='<div class="card">'+title(kind==="wine"?"酒類叫貨紀錄":"食材叫貨紀錄")+'<button class="alt" onclick="'+(kind==="wine"?'wineHub()':'showMenu()')+'">返回</button><p class="summary">本裝置測試紀錄 '+hs.length+' 筆｜預估總額 NT$ '+fmt(total)+'</p><div id="histList"></div></div>';view(html);var b=$("histList");hs.forEach(h=>{var el=document.createElement("div");el.className="item";el.innerHTML='<b>'+safe(h.vendor)+'｜'+safe(h.delivery)+'</b><div class="muted">'+safe(h.created.slice(0,10))+'・NT$ '+fmt(h.total)+'</div><pre class="small">'+safe(h.msg)+'</pre><div class="actions">'+(kind==="wine"?'<button class="print-h">挑選酒標列印</button>':'')+'<button class="alt copy-h">複製訊息</button><button class="danger del-h">刪除紀錄</button></div>';if(kind==="wine")el.querySelector(".print-h").onclick=()=>fromHistory(h);el.querySelector(".copy-h").onclick=async()=>{var ok=await copyText(h.msg);alert(ok?"已複製":"請長按文字複製")};el.querySelector(".del-h").onclick=()=>{if(confirm("確定刪除此筆測試紀錄？")){store("history-"+kind,history(kind).filter(x=>x.id!==h.id));showHistory(kind)}};b.appendChild(el)});if(!hs.length)b.innerHTML='<p class="muted">目前沒有測試紀錄。</p>'}
function tagHtml(w,s){var n=String(w.desc||"").length;var fs=n>150?7:n>100?8:9;return '<div class="tag"><div class="nm">'+safe(w.name)+'</div><div class="pr">'+safe(w.ml)+'ML　'+safe(w.price)+'元</div><div class="des" style="font-size:'+fs+'pt">'+safe(w.desc)+'</div><div class="foot"><b>'+safe(s)+'</b><small>'+safe(w.cup)+'</small></div></div>'}
function fromHistory(h){var lines=h.lines;page="chooseLabels";var html='<div class="card">'+title("選擇要列印的酒標")+'<p class="muted">每款預設1張，可取消勾選及修改張數；不影響叫貨紀錄。</p><div id="labels"></div><button onclick="printSelected()">列印已勾選酒標</button><button class="alt" onclick="showHistory(\'wine\')">返回叫貨紀錄</button></div>';view(html);$("labels").innerHTML=lines.map((l,i)=>'<div class="item row"><input type="checkbox" style="flex:0 0 24px" id="lc'+i+'" checked><div class="grow"><b>'+safe(l.x.name)+'</b><div class="muted">叫貨 '+l.q+' 瓶</div></div><input class="num" type="number" id="ln'+i+'" min="1" max="100" value="1"></div>').join("");window.printSelected=function(){var jobs=[];lines.forEach((l,i)=>{if($("lc"+i).checked){var q=Math.max(1,Math.min(100,Number($("ln"+i).value)||1));jobs.push({wine:l.x,qty:q})}});printLabels(jobs)}}
function manualLabels(){page="manual";category="全部";drawManual()}function drawManual(){var list=wines().filter(w=>(category==="全部"||w.type===category));view('<div class="card">'+title("手動酒標列印")+'<button class="alt" onclick="wineHub()">返回</button><div class="tabs" style="top:65px">'+WINE_TYPES.map(t=>'<button class="'+(t===category?'on':'')+'" onclick="category=\''+t+'\';drawManual()">'+t+'</button>').join("")+'</div><label>搜尋酒款</label><input id="ms" placeholder="搜尋酒名"><div id="manualList"></div><p class="summary">已加入 <b id="jobCount">'+printJobs.reduce((a,x)=>a+x.qty,0)+'</b> 張</p><button onclick="printLabels(printJobs)">列印待印清單</button><button class="alt" onclick="printJobs=[];drawManual()">清空待印清單</button></div>');var render=()=>{var q=$("ms").value.toLowerCase();$("manualList").innerHTML=list.filter(w=>w.name.toLowerCase().includes(q)).map(w=>'<div class="item row"><div class="grow"><b>'+safe(w.name)+'</b><div class="muted">'+safe(w.type)+'｜'+safe(w.ml)+'ml</div></div><button data-id="'+safe(w.id)+'">加入1張</button></div>').join("");$("manualList").querySelectorAll("button").forEach(b=>b.onclick=()=>{printJobs.push({wine:wines().find(w=>w.id===b.dataset.id),qty:1});$("jobCount").textContent=printJobs.reduce((a,x)=>a+x.qty,0)})};$("ms").oninput=render;render()}
function printLabels(jobs){if(!jobs||!jobs.length){alert("請先選擇要列印的酒款");return}var html="";var qty=0;jobs.forEach(j=>{for(var i=0;i<Math.max(1,Math.min(100,j.qty));i++){html+=tagHtml(j.wine,shop);qty++}});if(qty>200&&!confirm("即將列印 "+qty+" 張，繼續？"))return;$("printRoot").innerHTML=html;setTimeout(()=>window.print(),100)}
function editWineList(){page="edit";var ws=wines();var html='<div class="card">'+title("酒款資料管理")+'<button class="alt" onclick="wineHub()">返回</button><p class="muted">以下資料是各裝置的示範資料。可以新增、編輯測試酒款；正式資料尚未串接。</p><label>選擇酒款（或選擇新增）</label><select id="editPick"><option value="">＋ 新增酒款</option>'+ws.map(w=>'<option value="'+safe(w.id)+'">'+safe(w.name)+'</option>').join("")+'</select><label>酒款名稱</label><input id="eName"><label>分類</label><select id="eType"><option>清酒</option><option>燒酎</option><option>利口酒</option></select><label>代理商</label><input id="eSupplier"><div class="grid"><div><label>容量 ml</label><input id="eMl" type="number" value="720"></div><div><label>示範進價</label><input id="eCost" type="number"></div><div><label>整瓶售價</label><input id="ePrice" type="number"></div><div><label>單杯價格</label><input id="eCup" type="number"></div></div><label>酒款介紹</label><textarea id="eDesc" rows="5"></textarea><div class="preview" id="tagPrev"></div><div class="actions"><button onclick="saveWine()">儲存酒款</button><button class="danger" onclick="deleteWine()">刪除酒款</button></div></div>';view(html);$("editPick").onchange=fillEdit;["eName","eType","eSupplier","eMl","eCost","ePrice","eCup","eDesc"].forEach(x=>$(x).oninput=updateTag);fillEdit()}
function fillEdit(){var w=wines().find(x=>x.id===$("editPick").value)||{};$("eName").value=w.name||"";$("eType").value=w.type||"清酒";$("eSupplier").value=w.supplier||"";$("eMl").value=w.ml||720;$("eCost").value=w.cost||"";$("ePrice").value=w.price||"";$("eCup").value=w.cup||"";$("eDesc").value=w.desc||"";updateTag()}
function wineFromEdit(){return {id:$("editPick").value||"new-"+Date.now(),name:$("eName").value.trim(),type:$("eType").value,supplier:$("eSupplier").value.trim(),ml:Number($("eMl").value)||720,cost:Number($("eCost").value)||0,price:Number($("ePrice").value)||0,cup:Number($("eCup").value)||0,desc:$("eDesc").value}}
function updateTag(){$("tagPrev").innerHTML=tagHtml(wineFromEdit(),shop)}
function saveWine(){var w=wineFromEdit();if(!w.name){alert("請輸入酒名");return}var ws=wines(),i=ws.findIndex(x=>x.id===w.id);if(i<0)ws.push(w);else ws[i]=w;store("wines",ws);alert("已儲存於本機測試資料");editWineList()}
function deleteWine(){var id=$("editPick").value;if(!id)return;if(confirm("確定刪除此筆測試酒款？")){store("wines",wines().filter(x=>x.id!==id));editWineList()}}
goHome();
</script></body></html>
